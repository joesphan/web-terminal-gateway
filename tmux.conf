# The shell lives in this tmux session; browsers attach and detach freely.
# Do not add destroy-unattached: a dropped WebSocket or a closed tab must not
# end the session.
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -g escape-time 10
set -g mouse on
set -g set-clipboard on
# Size the pane to the most recently active client, not to a stale one.
set -g window-size latest
set -g destroy-unattached off
